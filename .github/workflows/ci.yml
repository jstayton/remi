name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The oldest Xcode Remi supports (26) is the default here.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # bin/build-uxplay names libplist's version with git describe, which needs its tags.
          fetch-depth: 0
      - name: Install build tools
        run: brew install cmake pkgconf openssl@3 autoconf automake libtool
      - name: Lint
        run: swift format lint --strict -r Remi RemiTests
      - name: Test
        run: bin/test
